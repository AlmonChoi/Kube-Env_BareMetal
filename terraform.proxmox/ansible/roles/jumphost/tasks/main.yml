---
- name: Install prerequisite packages on jumphost
  apt:
    name:
      - curl
      - git
      - apt-transport-https
      - ca-certificates
      - gnupg
    update_cache: yes
    state: present

- name: Install Helm binary
  shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Cilium CLI
  shell: |
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz
    tar xzvf cilium-linux-${CLI_ARCH}.tar.gz -C /usr/local/bin
    rm cilium-linux-${CLI_ARCH}.tar.gz
  args:
    creates: /usr/local/bin/cilium

- name: Install Hubble CLI
  shell: |
    HUBBLE_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/hubble/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name https://github.com/cilium/hubble/releases/download/${HUBBLE_VERSION}/hubble-linux-${CLI_ARCH}.tar.gz
    tar xzvf hubble-linux-${CLI_ARCH}.tar.gz -C /usr/local/bin
    rm hubble-linux-${CLI_ARCH}.tar.gz
  args:
    creates: /usr/local/bin/hubble

- name: Install kubectl on jumphost
  shell: |
    mkdir -p /etc/keyrings
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ k8s_version.split('.')[0:2] | join('.') }}/deb/Release.key | gpg --dearmor -o /etc/keyrings/kubernetes-apt-keyring.gpg
    echo "deb [signed-by=/etc/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version.split('.')[0:2] | join('.') }}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
    apt-get update && apt-get install -y kubectl
  args:
    creates: /usr/local/bin/kubectl