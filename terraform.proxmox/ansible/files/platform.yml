---
# Seteup external IP address pool
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "lab-pool"
spec:
  blocks:
  - start: "192.168.89.10"
    stop: "192.168.89.254"
  # serviceSelector:
  #   matchExpressions:
  #    - {key: role, operator: In, values: [frontend, monitor]}

---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: vyos-peer
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp

---
# This defines which nodes policy applies to. The label bgp-policy=a is defined here, will have to add this label 
# to all of our cluster nodes before the policy will be applied to them
# $ kubectl label nodes k8s-node1.localdomain bgp-policy=homelab
# $ kubectl label nodes k8s-node2.localdomain bgp-policy=homelab
# $ kubectl get nodes -l bgp-policy=homelab

apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: expresscart-bgp
spec:
  nodeSelector:
    matchLabels:
      bgp-policy: homelab
  bgpInstances:
    - name: vyos
      # ASN in the well-known private ASN range (64512 – 65535). We set our ASN to 65400:
      localASN: 65400
      # Cilium not to advertise the Pod Network to peers to avoid external traffic to be routed directly to pods
      peers:
        - name: vyos-router
          peerAddress: "192.168.88.2"
          peerASN: 65400
          peerConfigRef:
            name: vyos-peer

---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: expresscart-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: somekey
            operator: NotIn
            values:
              - never-used-value

---
# Network service for mapping to Cilium Hubble UI
apiVersion: v1
kind: Service
metadata:
  name: hubble-ui-ext
  labels:
       role: monitor
  namespace: kube-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hubble.lab
spec:
  loadBalancerIP: 192.168.89.100
  type: LoadBalancer
  selector:
    k8s-app: hubble-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081

---
