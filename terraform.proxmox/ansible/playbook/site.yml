---
- name: Configure Jumphost Tooling
  hosts: jumphost
  become: true
  tags:
    - jumphost_tools
  roles:
    - jumphost

- name: Setup Kubernetes Control Plane
  hosts: control_plane
  become: true
  tags:
    - k8s_control
  roles:
    - k8s_control_plane

- name: Setup Kubeconfig on Jumphost
  hosts: jumphost
  gather_facts: false
  tags:
    - k8s_control
  tasks:
    - name: Read admin.conf from primary control plane node
      slurp:
        src: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: admin_conf_encoded
      run_once: true
      become: true  # Required to read root-owned admin.conf on cp-node-1

    - name: Ensure .kube directory exists in user home
      file:
        path: "~/.kube"
        state: directory
        mode: '0700'
      become: false  # Runs as the current user so it targets their home directory

    - name: Write/Update admin.conf to user kubeconfig
      copy:
        content: "{{ admin_conf_encoded['content'] | b64decode }}"
        dest: "~/.kube/config"
        mode: '0600'
      become: false  # Runs as the current user

- name: Setup Kubernets Worker Nodes and Join to Cluster
  hosts: workers
  become: true
  tags:
    - k8s_worker
  roles:
    - k8s_worker_nodes

- name: Label Worker Nodes 
  hosts: jumphost
  gather_facts: false
  tags:
    - k8s_worker
  tasks:
    - name: Cilium BGP route label
      ansible.builtin.command: >
        kubectl label node {{ item }} bgp-policy=homelab --overwrite
      loop: "{{ groups['workers'] }}"

- name: Cilium Installation
  hosts: jumphost
  tags:
    - setup_cilium
  tasks:
    - name: Add Cilium Helm repository
      shell: helm repo add cilium https://helm.cilium.io/ && helm repo update
    - name: Install Cilium via Helm from Jumphost with Custom Options
      shell: |
        helm upgrade --install cilium cilium/cilium \
          --version {{ cilium_chart_version }} \
          --namespace kube-system \
          --set k8sServiceHost={{virtual_ip}} \
          --set k8sServicePort=6443 \
          --set kubeProxyReplacement=true \
          --set preflight.enabled=false \
          --set gatewayAPI.enabled=true \
          --set hubble.relay.enabled=true \
          --set hubble.ui.enabled=true \
          --set envoy.enabled=true \
          --set encryption.enabled=true \
          --set encryption.type="wireguard" \
          --set bgpControlPlane.enabled=true \
          --set bgp.announce.loadbalancerIP=true

- name: Ingress-nginx Installation
  hosts: jumphost
  tags:
    - setup_ingress-nginx
  tasks:
    - name: Add ingress-nginx Helm repository
      shell: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx && helm repo update
      become: false

    - name: Install or upgrade ingress-nginx via Helm
      shell: |
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --version {{ ingress_nginx_chart_version }} \
          --namespace ingress-nginx \
          --create-namespace \
          --set controller.image.tag={{ ingress_nginx_version }}
      become: false

- name: Kube-Prometheus-Stack Installation
  hosts: jumphost
  tags:
    - setup_kube-prometheus-stack
  tasks:
    - name: Add Prometheus Community Helm repository
      shell: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update
      become: false

    - name: Install or upgrade kube-prometheus-stack via Helm
      shell: |
        helm upgrade --install prometheus-stack prometheus-community/kube-prometheus-stack \
          --version {{ kubePrometheusStack_chart_version }} \
          --namespace prometheus-stack \
          --create-namespace
      become: false

- name: Argo CD Installation
  hosts: jumphost
  tags:
    - setup_argocd
  tasks:
    - name: Add Argo CD Helm repository
      shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
      become: false

    - name: Install or upgrade Argo CD via Helm
      shell: |
        helm upgrade --install argocd argo/argo-cd \
          --version {{ argocd_chart_version }} \
          --namespace argocd \
          --create-namespace
      become: false
