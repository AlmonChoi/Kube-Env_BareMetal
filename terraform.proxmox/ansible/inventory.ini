[jumphost]
jumphost ansible_connection=local

[control_plane]
k8s-control1 ansible_host=192.168.88.101
k8s-control2 ansible_host=192.168.88.102
k8s-control3 ansible_host=192.168.88.103

[workers]
k8s-worker1 ansible_host=192.168.88.111
k8s-worker2 ansible_host=192.168.88.112
k8s-worker3 ansible_host=192.168.88.113

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa

# As of 2026-10-01, the comptaible version of ingress-nginx and k8s are  
# Kubernetes	1.35.9 ingress-nginx v1.15.1
k8s_version="1.35.9"
ingress_nginx_chart_version="4.15.1"
ingress_nginx_version="1.15.1"

# vip of Kube-VIP
virtual_ip=192.168.88.88
kube_vip_version="0.8.0" 

cilium_chart_version="1.20.2"
argocd_chart_version="10.10.2"
kubePrometheusStack_chart_version="92.3.0" 


# Parameters unique to the Control Plane nodes
[control_plane:vars]
vip_interface="eth0"
pod_network_cidr="10.0.0.0/16"